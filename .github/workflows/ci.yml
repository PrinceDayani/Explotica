name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # fastapi + httpx so the dashboard security tests actually run in
          # the blocking gate rather than being skipped by importorskip.
          pip install pytest "fastapi<1" httpx
      - name: Run test suite
        # Blocking gate. Deselect tests that require IPv6 loopback, which
        # GitHub-hosted runners do not provide.
        run: pytest -q -k "not ipv6_loopback"

  lint:
    name: lint + types (reporting)
    runs-on: ubuntu-latest
    # Non-blocking: the codebase predates enforced lint/type checking.
    # The individual tool steps are continue-on-error so their findings are
    # surfaced as annotations while the job itself reports success — a red
    # lint run never blocks a correct change. Cleanup is tracked separately.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff mypy
      - name: ruff
        continue-on-error: true
        run: ruff check . --output-format=github
      - name: mypy
        continue-on-error: true
        run: mypy explotica
